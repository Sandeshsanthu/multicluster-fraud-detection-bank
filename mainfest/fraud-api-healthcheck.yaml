apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: fraud-api-health-policy
  namespace: fraud-detection
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8000
        requestPath: /health
  targetRef:
    group: net.gke.io
    kind: ServiceImport
    name: fraud-api-svc
