# mainfest/fraud-api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-api
  template:
    metadata:
      labels:
        app: fraud-api
    spec:
      containers:
      - name: fraud-api
        image: docker.io/sandeshs/fraud-api:v1
        env:
        - name: MODEL_PATH
          value: "models/fraud_pipeline.joblib"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: '500m'
            memory: '512Mi'
          limits:
            cpu: '2000m'
            memory: '2Gi'
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 45
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api-svc
  namespace: fraud-detection
  annotations:
    # 1. Links the Load Balancer directly to Pods
    cloud.google.com/neg: '{"exposed_ports": {"80":{}}}'
    # 2. Explicitly tells the Gateway that this port is HTTP
    cloud.google.com: '{"fraud-api-port":"HTTP"}'
spec:
  selector:
    app: fraud-api
  ports:
  - name: fraud-api-port # Named port for the controller to track
    port: 80
    targetPort: 8000
  type: ClusterIP
