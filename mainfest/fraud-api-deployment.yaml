apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-api
  template:
    metadata:
      labels:
        app: fraud-api
    spec:
      containers:
      - name: fraud-api
        image: docker.io/sandeshs/fraud-api:v3
        imagePullPolicy: Always # Ensures GKE pulls the fresh v1 if you re-pushed it
        env:
        - name: MODEL_PATH
          value: "models/fraud_pipeline.joblib"
        - name: REDIS_HOST
          value: "34.118.238.237"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: '100m'
            memory: '256Mi'
          limits:
            cpu: '500m'
            memory: '512Mi'
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 45
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api-svc
  namespace: fraud-detection
  annotations:
    cloud.google.com/neg: '{"exposed_ports": {"80":{}}}'
spec:
  selector:
    app: fraud-api
  ports:
  - name: fraud-api-port
    port: 80
    targetPort: 8000
  type: ClusterIP
